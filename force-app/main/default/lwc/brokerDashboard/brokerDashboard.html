<template>
  <lightning-card title="Broker Dashboard" icon-name="standard:account">
    <template if:true={hasBrokers}>
      <div class="slds-p-around_medium">
        <lightning-layout multiple-rows>
          <template for:each={brokers} for:item="broker">
            <lightning-layout-item key={broker.Id} size="12" medium-device-size="6" large-device-size="4" padding="around-small">
              <lightning-card>
                <div class="slds-text-align_center slds-p-around_medium">
                  <lightning-avatar
                    src={broker.picture}
                    fallback-icon-name="standard:person_account"
                    variant="circle"
                    size="large"
                  ></lightning-avatar>
                  <div class="slds-text-heading_medium slds-m-top_small">
                    {broker.Name}
                  </div>
                  <div class="slds-text-body_small slds-text-color_weak">
                    {broker.title}
                  </div>
                  <div class="slds-m-top_medium">
                    <lightning-badge label={broker.propertyCount} icon-name="custom:custom85"></lightning-badge>
                    <span class="slds-m-left_x-small">Properties</span>
                  </div>
                  <div class="slds-m-top_small">
                    <lightning-formatted-number
                      value={broker.totalValue}
                      format-style="currency"
                      currency-code="USD"
                    ></lightning-formatted-number>
                    <div class="slds-text-body_small slds-text-color_weak">Total Value</div>
                  </div>
                </div>
              </lightning-card>
            </lightning-layout-item>
          </template>
        </lightning-layout>
      </div>
    </template>

    <template if:false={hasBrokers}>
      <div class="slds-p-around_large slds-text-align_center">
        <lightning-icon icon-name="custom:custom19" size="large"></lightning-icon>
        <p class="slds-m-top_medium">No brokers found</p>
      </div>
    </template>

    <template if:true={error}>
      <div class="slds-p-around_medium">
        <p>Error loading brokers: {error.body.message}</p>
      </div>
    </template>
  </lightning-card>
</template>
